  <h1>에듀넷 MCP</h1>
  <p>에듀넷 교육자료 검색과 성취수준 자료 탐색을 위한 원격 MCP 서버입니다.</p>
  <p>MCP 연결 주소: <code>/api/mcp</code> (Streamable HTTP)</p>
  <p>기본 검색은 검색 메타데이터와 발췌를 제공합니다. 성취수준 기능을 활성화한 서버에서는 후보를 검색하고 첨부 PDF·HWP를 선택하여 원문과 근거 위치를 확인할 수 있습니다.</p>
  <p>성취수준 읽기는 베타 기능입니다. 스캔 문서의 OCR과 이미지·그래프 해석은 지원하지 않습니다.</p>
